<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>전자 전술상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 상황바 / 좌측 화이트보드(개황도 + 대기구역 4칸, 실물 상황판 비율 16:10) / 우측 운영패널(자원·진행·구조·기록) */
:root{
  --bg:#e6ebf2; --panel:#f8fafc; --panel2:#eef2f7; --ink:#0f1d33; --muted:#56667e; --line:#cfd8e4;
  --accent:#0d2c5e; --accent-ink:#ffffff; --signal:#d4271d; --ok:#1d7a46; --warn:#b26b00;
  --frame:#1d2330; --board:#fbfcfd; --boardline:#1b1f27;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b111c; --panel:#121a28; --panel2:#182234; --ink:#e5ebf4; --muted:#93a2b8; --line:#26344a;
  --accent:#6d9ae6; --accent-ink:#08121f; --signal:#ff5d52; --ok:#4cc382; --warn:#f0a63a;
  --frame:#04070c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b111c; --panel:#121a28; --panel2:#182234; --ink:#e5ebf4; --muted:#93a2b8; --line:#26344a;
  --accent:#6d9ae6; --accent-ink:#08121f; --signal:#ff5d52; --ok:#4cc382; --warn:#f0a63a;
  --frame:#04070c; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-inline:12px;padding-block:8px;gap:8px;min-height:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 420px;max-width:760px}
.brand .mk{font-family:var(--f-display);background:var(--accent);color:var(--accent-ink);padding:4px 8px;border-radius:6px;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.inc{display:flex;flex-direction:column;min-width:0;flex:1}
.inc input{border:0;background:transparent;padding:0 4px;min-width:0;width:100%;border-radius:4px}
.inc input:hover,.inc input:focus{background:var(--panel2)}
.inc .t{font-weight:700;font-size:16px}
.inc .a{color:var(--muted);font-size:12.5px}
.clock{display:flex;align-items:flex-end;gap:18px;margin-left:auto}
.clock .cb{display:flex;flex-direction:column;gap:3px}
.clock .crow{display:flex;align-items:center;gap:5px}
.cbtn{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px;font-weight:700;padding:0;display:inline-flex;align-items:center;justify-content:center}
.cbtn:hover{border-color:var(--accent)}
.cbtn.go{background:var(--ok);border-color:var(--ok);color:#fff}
#cbEl.paused .el{color:var(--muted)}
#cbEl.paused .lbl::after{content:' · 중지됨';color:var(--warn);font-weight:700}
.clock .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.clock .el{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.clock .el.now{color:var(--muted)}
.alert20{display:none;align-items:center;background:var(--signal);color:#fff;border:0;border-radius:999px;padding:1px 8px;font-weight:700;font-size:11px;margin-left:4px;animation:pulse 1.4s infinite;vertical-align:1px}
.alert20.on{display:inline-flex}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.alert20{animation:none}}
.topbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--signal)}
.btn.sm{min-height:28px;padding:3px 8px;font-size:12px}
.ex{background:#ffe9a8;color:#5a3d00;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}

/* main */
.btabs{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:0 2px;margin-bottom:-4px;min-height:34px;scrollbar-width:thin}
.bt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-bottom:0;background:var(--panel2);border-radius:9px 9px 0 0;padding:6px 6px 6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;flex:none;max-width:240px}
.bt .nm{overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bt .el{font-family:var(--f-mono);font-size:11.5px}
.bt .x{border:0;background:transparent;color:var(--muted);font-size:14px;width:22px;height:22px;border-radius:5px;padding:0;cursor:pointer}
.bt .x:hover{background:var(--line);color:var(--signal)}
.bt.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.bt.add{padding:6px 12px;color:var(--accent);font-weight:700;background:transparent;border-style:dashed}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 12px var(--pw,280px);gap:0;min-height:0}
.main>.boardcol{order:1}.main>.split{order:2}.main>.panel{order:3}
.split{position:relative;cursor:col-resize;touch-action:none;display:flex;justify-content:center}
.split::before{content:"";width:4px;height:44px;border-radius:2px;background:var(--line);position:absolute;top:50%;margin-top:-22px}
.split:hover::before{background:var(--accent)}
.split .ph-btn{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:22px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12px;padding:0;cursor:pointer;z-index:2}
.split .ph-btn:hover{border-color:var(--accent)}
.pc .main{grid-template-columns:minmax(0,1fr) 22px}
.pc .panel{display:none}
.boardcol{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.viewbar[hidden],.tools[hidden],.viewbar [hidden]{display:none!important}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px}
.tool{border:1px solid transparent;background:transparent;border-radius:7px;min-width:40px;height:40px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted)}
.tool svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool.on svg{stroke:var(--accent-ink)}
.tool:hover:not(.on){border-color:var(--line)}
.sep{width:1px;height:28px;background:var(--line);margin:0 3px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.stampbtn img{width:22px;height:22px;object-fit:contain}
.viewbar{padding:6px 8px;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
#sopView{min-height:100%;padding:20px 24px 40px;color:#1b2433;background:#f4f6fa;font-family:var(--f-body)}
.sv-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid #0d2c5e}
.sv-h .ey{font:600 11px/1.2 var(--f-mono);letter-spacing:.14em;color:#b5121b;text-transform:uppercase}
.sv-h h2{margin:6px 0 0;font-size:24px;font-weight:700;color:#0d2c5e;letter-spacing:-.01em;text-wrap:balance}
.sv-h .sub{margin-top:4px;font-size:12.5px;color:#5b6b82}
.sv-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sv-prog{font:600 12px var(--f-mono);background:#0d2c5e;color:#fff;border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#5b6b82}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg-hl{background:#ffe9a6;box-shadow:inset 0 0 0 1px #e6c255}.lg-red{background:#b5121b}.lg-ck{background:#dff1e5;box-shadow:inset 0 0 0 1px #6dbb8b}
.stp-wrap{overflow-x:auto;padding-bottom:4px}
.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
@media (min-width:1500px){.stp{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ph{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;background:#fff;border:1px solid #d6deea;border-radius:12px;padding-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(13,44,94,.06)}
.ph-h{display:flex;align-items:center;gap:8px;background:#0d2c5e;color:#fff;font-weight:700;font-size:15px;padding:9px 12px;margin-bottom:4px;letter-spacing:-.01em}
.ph-h b{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:#0d2c5e;font:700 12px var(--f-mono);display:inline-flex;align-items:center;justify-content:center}
.ph.fin .ph-h{background:#b5121b}.ph.fin .ph-h b{color:#b5121b}
.ph .ph-h.tan{background:#e8eef8;color:#0d2c5e;border-bottom:1px solid #d6deea}
.ph .ph-h.redh{background:#b5121b;color:#fff}
.l1{margin:0 10px;padding:5px 0 5px 10px;border-left:3px solid #c3d1e6}
.l1:hover{border-left-color:#0d2c5e}
.l1>.nd{font-weight:700;font-size:14px;color:#0d2c5e}
.l1>.nd.red{color:#fff}.l1>.nd.tag{color:#6b3d0c}
.tr{list-style:none;margin:3px 0 0;padding-left:10px;border-left:1px solid #d5dde9}
.tr li{position:relative;padding-left:8px;margin:2px 0}
.tr li::before{content:"";position:absolute;left:-10px;top:.8em;width:13px;border-top:1px solid #d5dde9}
.nd{display:inline-block;white-space:normal;cursor:pointer;border-radius:6px;padding:2px 6px;font-size:13px;line-height:1.45;border:0;background:transparent;color:#2a3546;text-align:left;font-family:inherit}
.nd:hover{background:#eef3fb}
.nd:focus-visible{outline:2px solid #0d2c5e;outline-offset:1px}
.nd.hl{background:#ffe9a6;color:#4d3800;font-weight:700;box-shadow:inset 0 0 0 1px #e6c255}
.nd.red{background:#b5121b;color:#fff;font-weight:700;letter-spacing:.01em;padding:3px 9px;box-shadow:0 1px 2px rgba(181,18,27,.25)}
.nd.red:hover{background:#c8161f;color:#fff}.nd.tag:hover{background:#f0d6b8}.nd.gray:hover{background:#7a8494;color:#fff}
.nd.tag{background:#f6e3cd;color:#6b3d0c;font-weight:700}
.nd.gray{background:#8a94a3;color:#fff;font-weight:700}
.nd.ck{background:#dff1e5;color:#14713d;box-shadow:inset 0 0 0 1px #6dbb8b}
.nd.ck::after{content:"✓";margin-left:5px;font-weight:700}
.nd .rd{color:#b5121b;font-weight:700}
.nd.red .rd{color:#fff}
.nd.ex{display:block;margin:3px 0;padding:6px 10px;background:#fffaeb;border-left:3px solid #e0a325;border-radius:0 8px 8px 0;font-size:12.5px;font-weight:500;color:#3b2f12;box-shadow:none}
.nd.ex.ck{background:#dff1e5;border-left-color:#3d9a63}
/* manual */
.man{max-width:1180px;margin:0 auto}
.man-qs{background:linear-gradient(135deg,#0d2c5e,#16407f);color:#fff;border-radius:14px;padding:16px 18px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(13,44,94,.18)}
.man-qh{font-weight:700;font-size:15px;margin-bottom:10px}.man-qh small{font:600 11px var(--f-mono);opacity:.7;margin-left:6px;letter-spacing:.08em}
.man-qs ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.man-qs li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 10px 10px;position:relative}
.man-qs .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#fff;color:#0d2c5e;font:700 11px var(--f-mono);align-items:center;justify-content:center;margin-right:6px}
.man-qs li b{font-size:13.5px}.man-qs li p{margin:6px 0 0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.82)}.man-qs li p b{color:#ffd84d;font-size:12px}
.man-toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 -24px 14px;position:sticky;top:0;z-index:5;background:rgba(244,246,250,.96);backdrop-filter:blur(4px);padding:10px 24px;border-bottom:1px solid #dfe6f0;box-shadow:0 4px 10px -6px rgba(13,44,94,.25)}
.man-toc a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d6deea;border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;font-weight:600;color:#0d2c5e;text-decoration:none}
.man-toc a:hover{border-color:#0d2c5e}.man-toc em{font:700 10.5px var(--f-mono);font-style:normal;background:#0d2c5e;color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.man-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.man-s{background:#fff;border:1px solid #d6deea;border-radius:12px;padding:14px 16px 12px;box-shadow:0 1px 2px rgba(13,44,94,.06);scroll-margin-top:60px}
.man-s h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px;color:#0d2c5e;padding-bottom:8px;border-bottom:2px solid #e8eef8}
.man-s h3 .no{font:700 11px var(--f-mono);background:#b5121b;color:#fff;border-radius:5px;padding:3px 7px;letter-spacing:.06em}
.man-t{width:100%;border-collapse:collapse;font-size:12.5px}
.man-t tr+tr{border-top:1px dashed #e1e7f0}
.man-t td,.man-t th{padding:5px 6px;vertical-align:middle;text-align:left}
.man-t th{white-space:nowrap;color:#0d2c5e;font-weight:700;width:1%}
.man-t td.mi-c{width:1%;white-space:nowrap;color:#0d2c5e;font-weight:700;text-align:center}
.mi{width:20px;height:20px;vertical-align:middle;display:inline-block;fill:none;stroke:#1b2433;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;object-fit:contain}
.mi+.mi{margin-left:3px}.mi.wide{width:46px;height:24px}
.man-p{margin:0 0 8px;font-size:13px;line-height:1.6;color:#2a3546}
.man-l,.man-o{margin:6px 0 0;padding-left:18px;font-size:12.8px;line-height:1.65;color:#2a3546}.man-l li+li,.man-o li+li{margin-top:4px}
.man-l b,.man-o b,.man-p b{color:#0d2c5e}
kbd{font:600 11px var(--f-mono);background:#eef2f8;border:1px solid #c9d3e3;border-bottom-width:2px;border-radius:4px;padding:0 4px}
.tag{display:inline-block;border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700;line-height:18px}.tag.red{background:#d4271d;color:#fff}
.chipx{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;border-radius:4px;color:#fff;font-weight:800;font-size:11px;padding:0 5px}.chipx.k{background:#111}.chipx.r{background:#d4271d}
.tri{display:inline-block;border:2.5px solid var(--t);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700;margin:0 2px;line-height:16px}
.man-ic,.man-vh{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:4px 0 8px}
.man-ic>div,.man-vh>div{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f6f8fc;border:1px solid #e1e7f0;border-radius:8px;padding:7px 4px;font-size:11.5px;text-align:center}
.man-ic .mi{width:30px;height:30px}.man-ic .mi.side{display:inline-flex;align-items:center;justify-content:center;width:auto;padding:0 6px;background:#e9f0fb;border:2px solid #1b2a44;font-family:var(--f-display);font-size:13px;height:26px}
.man-vh .h{grid-column:1/-1;background:none;border:0;padding:0;align-items:flex-start;font-weight:700;color:#0d2c5e;font-size:12.5px}
.man-zone{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.man-zone span{border:1.5px solid var(--zc);color:var(--zc);border-radius:7px;padding:2px 9px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--zc) 7%,#fff)}
.man-flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 6px}.man-flow span{background:#e8eef8;color:#0d2c5e;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}.man-flow span:nth-child(n+7){background:#dff1e5;color:#14713d}.man-flow i{font-style:normal;color:#8a96a8;font-size:12px}
.man-scr{display:grid;grid-template-columns:1fr 92px;grid-template-rows:auto auto 120px;gap:4px;margin-bottom:8px;font-size:11px}
.man-scr .z{border-radius:6px;padding:5px 8px;line-height:1.4}
.man-scr .top{grid-column:1/-1;background:#0d2c5e;color:#fff}.man-scr .tool{grid-column:1;background:#e8eef8;color:#0d2c5e}
.man-scr .cv{grid-column:1;background:#fff;border:1.5px dashed #9fb0c8;display:flex;justify-content:space-between;align-items:stretch;gap:6px;padding:5px}
.man-scr .cv .p{background:#fff6dc;border:1px solid #e6c255;border-radius:5px;padding:3px 6px;font-size:10.5px}.man-scr .cv .p.r{background:#f3f6fb;border-color:#b9c6da}.man-scr .cv .mid{align-self:center;color:#8a96a8;font-weight:700}
.man-scr .zs{grid-column:2;grid-row:2/4;background:#f3f6fb;border:1px solid #d6deea;color:#0d2c5e;display:flex;align-items:center;justify-content:center;text-align:center}
.man-f{text-align:center;color:#8a96a8;font-size:12px;margin:18px 0 4px}
.maps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.maps a{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:8px;padding:7px 10px}
.maps a:hover{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 6%,var(--panel))}
.maps b{font-size:13.5px}.maps small{grid-column:1;font-size:11px;color:var(--muted)}.maps i{grid-column:2;grid-row:1/3;font-style:normal;font-weight:700;color:var(--mc);font-size:15px}
.sdman{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2)}
.sdman summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.sdlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sdlist .row{gap:5px;flex-wrap:nowrap}.sdlist .bx{width:20px;text-align:center;font:600 12px var(--f-mono);color:var(--muted)}.sdlist input{flex:1;min-height:30px}
.login{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px;background:#0b2147}
.login[hidden]{display:none}

  if(act.type==='bg'){const dx=(e.clientX-act.sx)/scale,dy=(e.clientY-act.sy)/scale,o=act.o,b=S.bgBox;
    if(act.mode==='move'){b.x=Math.round(Math.max(-b.w+120,Math.min(W-120,o.x+dx)));b.y=Math.round(Math.max(-b.h+120,o.y+dy));}else if(act.mode==='r'){b.w=Math.round(Math.max(80,o.w+dx));}else if(act.mode==='b'){b.h=Math.round(Math.max(80,o.h+dy));}else{b.w=Math.round(Math.max(120,o.w+dx));b.h=Math.round(b.w*o.h/o.w);}
    applyBg();renderSel();return;}
  if(act.type==='pan'&&Math.hypot(e.clientX-act.sx,e.clientY-act.sy)>6)act.moved=true;
  if(act.type==='pan'){stage.scrollLeft=act.l-(e.clientX-act.sx);stage.scrollTop=act.t-(e.clientY-act.sy);return;}
  if(act.type==='pen'){const l=act.s.pts[act.s.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.5)return;act.s.pts.push([Math.round(p[0]*10)/10,Math.round(p[1]*10)/10]);
    ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.strokeStyle=act.s.c;ctx.lineWidth=act.s.w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...l);ctx.lineTo(...p);ctx.stroke();ctx.restore();return;}
  if(act.type==='erase'){eraseAt(p);return;}
  if(act.type==='shape'){temp.b=p;redraw();}
});
function endAct(e){
  if(!act||e.pointerId!==act.pid)return;const a=act;act=null;
  if(a.type==='item'){a.el.classList.remove('drag');$('#trayBox')?.classList.remove('hot');
    if(!a.moved){if(a.vid)openVictim(a.vid);else openItem(a.id);return;}
    const x=parseFloat(a.el.style.left),y=parseFloat(a.el.style.top);
    if(a.vid){moveVictim(a.vid,x,y,inTray(e));return;}
    moveItem(a.id,x,y,inTray(e));return;}
  if(a.type==='pm'){if(a.moved){anchorPanel(a.k);applyPanels();layout();renderAll();}else renderZones();dirty();return;}
  if(a.type==='pr'){applyPanels();renderAll();dirty();return;}
  if(a.type==='bg'||a.type==='zr'){dirty();return;}
  if(a.type==='pan'){if(!a.moved&&S.bg&&S.bgBox){const p=bp(e),b=S.bgBox;if(p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h&&p[0]<CX){selBg=true;selB=null;renderSel();}}return;}
  if(a.type==='smove'||a.type==='sh'){if(a.type==='sh'||a.moved)dirty();return;}
  if(a.type==='txt'){if(a.moved)dirty();else openText(null,a.s);return;}
  if(a.type==='bld'){layout();renderAll();return;}
  if(a.type==='pen'){dirty();return;}
  if(a.type==='erase'){if(!a.n)UNDO.pop();return;}
  if(a.type==='shape'){const t=temp;temp=null;if(Math.hypot(t.b[0]-t.a[0],t.b[1]-t.a[1])>6){snap();S.strokes.push(t);if(a.cline)autoCheck(2,'통제선 설치');}redraw();dirty();}
}
board.addEventListener('pointerup',endAct);board.addEventListener('pointercancel',endAct);

/* ---------- two-finger pinch zoom (touch) + ctrl/trackpad wheel zoom ---------- */
const ZMAX=4;const TP=new Map();let pinch=null;
function zoomAt(z,mx,my){const r0=board.getBoundingClientRect(),bx=(mx-r0.left)/scale,by=(my-r0.top)/scale;
  zoom=Math.max(1,Math.min(ZMAX,z));if(innerWidth<=1100&&zoom>1)stage.style.height=Math.min(innerHeight*.75,H*fit*zoom+4)+'px';
  layout();const r=board.getBoundingClientRect();stage.scrollLeft+=r.left+bx*scale-mx;stage.scrollTop+=r.top+by*scale-my;}
function cancelAct(){const a=act;if(!a)return;act=null;
  if(a.type==='pen'){const i=S.strokes.indexOf(a.s);if(i>=0)S.strokes.splice(i,1);UNDO.pop();}
  else if(a.type==='shape'){temp=null;}
  else if(a.type==='erase'){if(a.n){const o=JSON.parse(UNDO.pop());S.strokes=o.s;S.buildings=o.b;}else UNDO.pop();}
  else if(a.type==='item'){a.el.classList.remove('drag');a.el.style.left=a.ox+'px';a.el.style.top=a.oy+'px';$('#trayBox')?.classList.remove('hot');}
  else if(a.type==='txt'&&a.moved){a.s.x=a.ox;a.s.y=a.oy;}
  else if(a.type==='pm'||a.type==='pr'||a.type==='bld'){renderAll();}
  redraw();}
function pinchInfo(){const [a,b]=[...TP.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
stage.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||SOPON)return;TP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(TP.size===2){e.stopPropagation();e.preventDefault();cancelAct();const i=pinchInfo();pinch={d0:i.d,z0:zoom,mx:i.mx,my:i.my};}
  else if(TP.size>2){e.stopPropagation();}},true);
stage.addEventListener('pointermove',e=>{if(!TP.has(e.pointerId))return;TP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!pinch||TP.size<2)return;e.stopPropagation();e.preventDefault();const i=pinchInfo();
  stage.scrollLeft-=i.mx-pinch.mx;stage.scrollTop-=i.my-pinch.my;pinch.mx=i.mx;pinch.my=i.my;
  const z=pinch.z0*i.d/pinch.d0;if(Math.abs(z-zoom)>.01)zoomAt(z,i.mx,i.my);},true);
function tpEnd(e){if(!TP.has(e.pointerId))return;TP.delete(e.pointerId);if(pinch){e.stopPropagation();if(TP.size<2){pinch=null;if(zoom<1.04){zoom=1;layout();}}}}
stage.addEventListener('pointerup',tpEnd,true);stage.addEventListener('pointercancel',tpEnd,true);
stage.addEventListener('wheel',e=>{if(SOPON||!e.ctrlKey)return;e.preventDefault();zoomAt(zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);},{passive:false});
function eraseAt(p){for(let i=S.strokes.length-1;i>=0;i--){const s=S.strokes[i];if(hit(s,p)){if(s.gid){S.strokes=S.strokes.filter(q=>q.gid!==s.gid);S.buildings=S.buildings.filter(b=>b.gid!==s.gid);if(selB===s.gid){selB=null;renderSel();}}else S.strokes.splice(i,1);act&&act.n++;redraw();dirty();return;}}}
function inTray(e){const t=$('#trayBox');if(!t)return false;const r=t.getBoundingClientRect();return r.width>0&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}

function moveItem(id,x,y,toTray){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const before=locate(it.x,it.y,it.placed);
  if(toTray&&it.k==='u'){it.placed=false;it.x=null;it.y=null;}else{it.x=Math.round(x);it.y=Math.round(y);if(it.k==='u')it.placed=true;}
  if(toTray&&it.k!=='u'){S.items=S.items.filter(i=>i!==it);}
  if(it.k==='u'){const after=locate(it.x,it.y,it.placed);const bt=locText(before),at=locText(after);if(bt!==at)log('자원',`${it.label} → ${at}`);}
  renderAll();
}
function moveVictim(vid,x,y,toTray){
  const v=S.victims.find(q=>q.id===vid);if(!v)return;
  if(toTray){v.placed=false;renderAll();return;}
  v.x=Math.round(x);v.y=Math.round(y);const L=locate(x,y);
  if(L.z==='med'&&!['임시의료소','병원이송'].includes(v.status))setVStatus(v,'임시의료소',true);
  else if(L.z==='field'&&L.f&&!v.locManual){const nf=L.f.replace(/F$/,'층');if(v.loc!==nf){v.loc=nf;}}
  renderAll();
}
function placeStamp(kind,p){
  if(kind==='side'){openSide(p);return;}
  S.items.push({id:uid(),k:'s',stamp:kind,x:Math.round(p[0]),y:Math.round(p[1]),rot:0});
  if(kind==='fire'){const f=floorAt(p[0],p[1]);log('상황','화점 표시'+(f?' - '+f:''));}
  if(kind==='hydrant')log('상황','소화전 위치 표시');
  if(kind==='ladder')log('상황','사다리 설치 위치 표시');
  if(kind==='truck')log('상황','소방차 위치 표시');
  if(kind==='ff')log('상황','소방대원 위치 표시'+(floorAt(p[0],p[1])?' - '+floorAt(p[0],p[1]):''));

function nextNum(type){const T=TYPES[type];let m=0;S.items.forEach(i=>{if(i.k==='u'&&i.type===type){const r=String(i.label).replace(T.p,'');const n=parseInt(r,10);if(!isNaN(n)&&n>m)m=n;}});return m+1;}

const SETKEY='ictc-tboard-sets';
function P1SET(){const U=(t,l)=>({type:t,label:l,org:'',crew:''});const seq=(t,n)=>Array.from({length:n},(_,i)=>U(t,TYPES[t].p+(i+1)));
  return{id:'p1',name:'1차출동대',auto:false,units:[U('cmd','지휘'),...seq('jin',6),...seq('gu',1),...seq('geup',1),U('gogo','고가'),U('gul','굴절'),...seq('pump',6),...seq('tank',6)]};}
function defaultSets(){const U=(t,l)=>({type:t,label:l,org:'',crew:''});const seq=(t,n)=>Array.from({length:n},(_,i)=>U(t,TYPES[t].p+(i+1)));
  return[P1SET(),
    S1SET()];}
function S1SET(){const U=(t,l)=>({type:t,label:l,org:'',crew:''});const seq=(t,n)=>Array.from({length:n},(_,i)=>U(t,TYPES[t].p+(i+1)));
  return{id:'s1',name:'1차출동(지휘,진5,구1,급1,고가,굴절)',auto:false,units:[U('cmd','지휘'),...seq('jin',5),...seq('gu',1),...seq('geup',1),U('gogo','고가'),U('gul','굴절')]};}
function getSets(){try{const r=localStorage.getItem(SETKEY);if(r){let a=JSON.parse(r);if(Array.isArray(a)){const sv=localStorage.getItem(SETKEY+'-v');if(sv!=='2'&&sv!=='3'){const i=a.findIndex(x=>x.id==='p1');if(i>=0)a[i]=P1SET();else a.unshift(P1SET());}if(sv!=='3'){const j=a.findIndex(x=>x.id==='s1');if(j>=0)a[j]=S1SET();else a.splice(1,0,S1SET());localStorage.setItem(SETKEY,JSON.stringify(a));localStorage.setItem(SETKEY+'-v','3');}return a;}}}catch(e){}return defaultSets();}

function setSummary(st){const c={};st.units.forEach(u=>{c[u.type]=(c[u.type]||0)+1;});return Object.entries(c).map(([t,n])=>TYPES[t].n+n).join(' · ');}
function applySet(id){const st=getSets().find(x=>x.id===id);if(!st)return;

  st.units.forEach(u=>{let label=u.label;
    if(st.auto){if(nx[u.type]==null)nx[u.type]=nextNum(u.type);label=(TYPES[u.type].p||'기타')+(nx[u.type]++);}

function editSet(src,opt){const AP=!!(opt&&opt.apply);

  const tbl=m.querySelector('#seTbl'),grid=m.querySelector('#seCnt');

  const sortU=()=>{st.units.sort((a,b)=>TK.indexOf(a.type)-TK.indexOf(b.type));};

  const all=()=>{drawGrid();draw();};

  grid.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.ct){e.preventDefault();setCount(e.target.dataset.ct,+e.target.value);all();}});

function modal(html,cls=''){closeModal();const m=document.createElement('div');m.className='mask';m.id='mask';m.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);
  const t0=performance.now();let downOnMask=false;
  m.addEventListener('pointerdown',e=>{downOnMask=e.target===m&&performance.now()-t0>250;});
  m.addEventListener('click',e=>{if(e.target.closest('[data-close]')){closeModal();return;}
    if(e.target===m){if(downOnMask)closeModal();downOnMask=false;}});return m;}

document.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])];const it=items.find(i=>i.kind==='file'&&i.type.startsWith('image/'));if(!it)return;

function applyBg(cb){const i=$('#bgimg');

    <div class="memo">${st.lists.map((l,i)=>`<div style="align-items:center"><span style="min-width:0"><b>${esc(l.name)}</b><br><span class="hint">${l.items.length}개 · ${esc(l.items.slice(0,4).join(', '))}${l.items.length>4?' …':''}</span></span><span style="margin-left:auto;display:flex;gap:4px;flex:none"><button class="btn sm pri" data-cla="${i}">불러오기</button><button class="btn sm danger" data-cld="${i}">삭제</button></span></div>`).join('')||'<span class="hint">저장된 목록이 없습니다.</span>'}</div>
    <div class="sec"><h5>새 상황판 기본 목록</h5><p class="hint" style="margin:0 0 6px">현재: ${esc((st.def||DEF_CHECKS).join(', '))}</p>
      <div class="row"><button class="btn" id="clDef">현재 목록을 기본으로 지정</button><button class="btn" id="clReset">기본값(10개) 복원</button><button class="btn" id="clBase">현재 상황판을 기본값으로 되돌리기</button></div></div>
    <div class="acts"><button class="btn" data-close>닫기</button></div>`);
  m.querySelector('#clSave').onclick=()=>{const n=$('#clN').value.trim();if(!n)return toast('목록 이름을 입력하세요');if(!cur.length)return toast('항목이 없습니다');const o=ckStore();o.lists=o.lists.filter(x=>x.name!==n);o.lists.unshift({name:n,items:cur,t:Date.now()});if(ckPut(o)){toast('목록을 저장했습니다');openCkLists();}};
  m.querySelectorAll('[data-cla]').forEach(b=>b.onclick=()=>{const l=ckStore().lists[+b.dataset.cla];if(!l)return;applyCkNames(l.items,l.name);closeModal();});
  m.querySelectorAll('[data-cld]').forEach(b=>b.onclick=()=>{const o=ckStore();o.lists.splice(+b.dataset.cld,1);ckPut(o);openCkLists();});
  m.querySelector('#clDef').onclick=()=>{const o=ckStore();o.def=cur;if(ckPut(o)){toast('새 상황판의 기본 목록으로 지정했습니다');openCkLists();}};
  m.querySelector('#clReset').onclick=()=>{const o=ckStore();o.def=null;ckPut(o);toast('기본 목록을 원래 10개로 복원했습니다');openCkLists();};
  m.querySelector('#clBase').onclick=()=>{closeModal();applyCkNames(ckDefault(),'기본 목록');};}
function applyCkNames(names,label){const old=ckL();const keep={};
  S.ck=names.map(n=>{const o=old.find(x=>x.n===n&&!keep[x.id]);if(o){keep[o.id]=1;return{id:o.id,n};}return{id:uid(),n};});
  const ids=new Set(S.ck.map(c=>c.id));for(const k in S.checks)if(!ids.has(k))delete S.checks[k];
  log('진행',`진행사항 목록 적용 - ${label}`);toast(`‘${label}’ 목록을 적용했습니다`);renderAll();}

/* ---------- 상황판 탭 ---------- */
function elapsedMin(b){return Math.floor(elMs(b.clock||{run:true,acc:0,since:b.t0||Date.now()})/60000);}
function renderBoardTabs(){const T=$('#btabs');const cur=BIDX.ids.find(x=>x.id===BIDX.active);if(cur){cur.title=S.meta.title;cur.t0=S.meta.t0;cur.clock=clk();}
  T.innerHTML=BIDX.ids.map((b,i)=>`<div class="bt ${b.id===BIDX.active?'on':''}" data-bid="${b.id}" title="${esc(b.title||'상황판 '+(i+1))}"><span class="nm">${esc((b.title||'상황판 '+(i+1)).slice(0,18))}</span><span class="el">${elapsedMin(b)}분</span><button class="x" data-bx="${b.id}" aria-label="상황판 닫기">✕</button></div>`).join('')+`<button class="bt add" id="btAdd">+ 상황판 추가</button>`;}
function updTabs(){const cur=BIDX.ids.find(x=>x.id===BIDX.active);if(cur){cur.title=S.meta.title;cur.t0=S.meta.t0;cur.clock=clk();}
  document.querySelectorAll('#btabs [data-bid]').forEach((el,i)=>{const b=BIDX.ids.find(x=>x.id===el.dataset.bid);if(!b)return;const nm=b.title||'상황판 '+(i+1);el.querySelector('.nm').textContent=nm.slice(0,18);el.title=nm;el.querySelector('.el').textContent=elapsedMin(b)+'분';});}
addEventListener('pagehide',()=>{clearTimeout(saveT);save();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveT);save();}});
function switchBoard(id){if(id===BIDX.active)return;clearTimeout(saveT);save();BIDX.active=id;idxSave();const o=boardLoad(id)||blank();if(view!=='board')setView('board');adopt(o);renderBoardTabs();}
function openAsTab(o){clearTimeout(saveT);save();const id=uid();BIDX.ids.push({id,title:o.meta.title||'',t0:o.meta.t0});BIDX.active=id;idxSave();if(view!=='board')setView('board');adopt(o);save();renderBoardTabs();}
function addBoard(){clearTimeout(saveT);save();const id=uid();BIDX.ids.push({id,title:'',t0:Date.now()});BIDX.active=id;idxSave();if(view!=='board')setView('board');adopt(blank());log('상황','상황판 작성 시작');save();renderBoardTabs();renderAll();setTimeout(()=>$('#mTitle').focus(),50);toast('새 상황판을 추가했습니다 — 사고명을 입력하세요');}
function closeBoard(id){const b=BIDX.ids.find(x=>x.id===id);if(!b)return;const nm=b.title||'이 상황판';
  confirmBox('상황판 닫기',`‘${esc(nm)}’ 탭을 닫으면 이 기기에서 삭제됩니다. 보관하려면 먼저 ‘저장·불러오기’에서 저장하세요.`,'닫기(삭제)',()=>{
    const i=BIDX.ids.findIndex(x=>x.id===id);BIDX.ids.splice(i,1);try{localStorage.removeItem(BKEY(id));}catch(e){}
    if(!BIDX.ids.length){const nid=uid();BIDX.ids.push({id:nid,title:'',t0:Date.now()});BIDX.active=nid;idxSave();adopt(blank());save();}
    else if(BIDX.active===id){BIDX.active=BIDX.ids[Math.max(0,i-1)].id;idxSave();adopt(boardLoad(BIDX.active)||blank());}
    else idxSave();
    renderBoardTabs();});}
$('#btabs').addEventListener('click',e=>{const x=e.target.closest('[data-bx]');if(x){e.stopPropagation();return closeBoard(x.dataset.bx);}if(e.target.closest('#btAdd'))return addBoard();const t=e.target.closest('[data-bid]');if(t)switchBoard(t.dataset.bid);});

/* ---------- 파일 저장(downloads) ---------- */
let DL=null,DLp=null;function getDL(){if(DL)return Promise.resolve(DL);try{if(!(window.claude&&window.claude.use))return Promise.resolve(null);if(!DLp)DLp=window.claude.use('downloads').then(d=>{DL=d;if(!d)DLp=null;return d;}).catch(()=>{DLp=null;return null;});return Promise.race([DLp,new Promise(r=>setTimeout(()=>r(null),3000))]);}catch(e){return Promise.resolve(null);}}getDL();

/* ---------- 전체화면 ---------- */
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function fullLabel(){const on=isFull()||document.body.classList.contains('focus');$('#bFull').textContent=on?'⛶ 전체화면 해제':'⛶ 전체화면';setTimeout(layout,60);}
$('#bFull').onclick=async()=>{
  if(document.body.classList.contains('focus')){document.body.classList.remove('focus');fullLabel();return;}
  if(isFull()){try{await (document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;
  try{if(!fn)throw 0;await fn.call(el);}catch(e){document.body.classList.add('focus');toast('이 화면에서는 브라우저 전체화면이 막혀 있어 상황판 영역을 최대로 넓혔습니다');}
  fullLabel();};
document.addEventListener('fullscreenchange',fullLabel);
document.addEventListener('fullscreenchange',()=>{const kb=navigator.keyboard;if(!kb||!kb.lock)return;
  if(document.fullscreenElement){kb.lock(['Escape']).then(()=>toast('전체화면 해제: Esc 키를 길게(약 2초) 누르거나 상단 ‘전체화면 해제’ 버튼')).catch(()=>{});}else{try{kb.unlock();}catch(e){}}});document.addEventListener('fullscreenchange',()=>{_lsz='';setTimeout(()=>{_lsz='';queueLayout();},60);});
function armAutoFull(){if(!UI.autoFull||isFull())return;const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;if(!fn)return;
  let done=false;const go=e=>{if(done)return;done=true;document.removeEventListener('pointerdown',go,true);document.removeEventListener('keydown',go,true);
    if(e&&e.target&&e.target.closest&&e.target.closest('#bFull'))return;if(!isFull()){try{const pr=fn.call(el);pr&&pr.then&&pr.then(fullLabel,()=>{});}catch(_){}}};
  document.addEventListener('pointerdown',go,true);document.addEventListener('keydown',go,true);
  try{fn.call(el).then(()=>{done=true;fullLabel();document.removeEventListener('pointerdown',go,true);document.removeEventListener('keydown',go,true);},()=>{toast('화면을 한 번 누르면 전체화면으로 전환됩니다');});}catch(_){toast('화면을 한 번 누르면 전체화면으로 전환됩니다');}}document.addEventListener('webkitfullscreenchange',fullLabel);

/* ---------- 좌측 패널 너비/숨기기 ---------- */
const UIK='ictc-tboard-ui';let UI={pw:280,hide:false,autoFull:true};try{Object.assign(UI,JSON.parse(localStorage.getItem(UIK)||'{}'));}catch(e){}
function applyUI(){document.documentElement.style.setProperty('--pw',UI.pw+'px');document.body.classList.toggle('pc',!!UI.hide);const b=$('#phBtn');b.textContent=UI.hide?'◀':'▶';b.title=UI.hide?'패널 보이기':'패널 숨기기';b.setAttribute('aria-label',b.title);setTimeout(layout,30);try{localStorage.setItem(UIK,JSON.stringify(UI));}catch(e){}}
$('#phBtn').addEventListener('click',e=>{e.stopPropagation();UI.hide=!UI.hide;applyUI();});
$('#split').addEventListener('pointerdown',e=>{if(e.target.closest('#phBtn'))return;e.preventDefault();const sp=e.currentTarget;sp.setPointerCapture(e.pointerId);
  const x0=e.clientX,w0=UI.hide?0:UI.pw;const mv=ev=>{const w=w0-(ev.clientX-x0);if(w<140){if(!UI.hide){UI.hide=true;applyUI();}}else{UI.hide=false;UI.pw=Math.round(Math.min(560,Math.max(220,w)));document.body.classList.remove('pc');document.documentElement.style.setProperty('--pw',UI.pw+'px');layout();}};
  const up=()=>{sp.removeEventListener('pointermove',mv);sp.removeEventListener('pointerup',up);applyUI();};sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);});
$('#split').addEventListener('dblclick',()=>{UI.pw=280;UI.hide=false;applyUI();});

/* boot */
(function(){let idx=null;try{idx=JSON.parse(localStorage.getItem(MKEY)||'null');}catch(e){}
  if(idx&&Array.isArray(idx.ids)&&idx.ids.length){BIDX=idx;if(!BIDX.ids.some(x=>x.id===BIDX.active))BIDX.active=BIDX.ids[0].id;const o=boardLoad(BIDX.active);S=o?migrate(o):blank();}
  else{S=load()||blank();const id=uid();BIDX={active:id,ids:[{id,title:S.meta.title,t0:S.meta.t0}]};idxSave();try{localStorage.setItem(BKEY(id),JSON.stringify(S));}catch(e){}}})();
ensureCk(S);
computeZones();
normCol(S);
if(S.pn){zl().m.prog=true;applyPanels();}
S.buildings.forEach(upgradeBuilding);
(function(){const L=$('#login');let ok=false;try{ok=sessionStorage.getItem('ictc-tboard-auth')==='1';}catch(e){}
  if(ok){L.hidden=true;}else{try{L.style.setProperty('--lgimg',`url("${CREDIT_IMG}")`);}catch(e){}setTimeout(()=>$('#lgPw').focus(),50);}
  const K=[48,49,49,57];const chk=v=>v.length===K.length&&[...v].every((c,i)=>c.charCodeAt(0)===K[i]);
  $('#lgEye').onclick=()=>{const i=$('#lgPw');i.type=i.type==='password'?'text':'password';i.focus();};
  $('#lgForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#lgPw'),v=i.value.trim();
    if(chk(v)){try{sessionStorage.setItem('ictc-tboard-auth','1');}catch(e){}L.hidden=true;i.value='';setTimeout(()=>{_lsz='';layout();},30);}
    else{const c=$('.lg-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#lgMsg').textContent=v?'비밀번호가 올바르지 않습니다.':'비밀번호를 입력하세요.';i.select();}});
})();
applyUI();renderBoardTabs();renderTools();applyBg();sizeInk();layout();renderAll();tick();setInterval(tick,1000);
addEventListener('resize',()=>queueLayout());
setTimeout(armAutoFull,1000);
let _lsz='',_lraf=0;const queueLayout=()=>{const k=stage.clientWidth+'x'+stage.clientHeight+'x'+innerWidth;if(k===_lsz)return;_lsz=k;cancelAnimationFrame(_lraf);_lraf=requestAnimationFrame(()=>{layout();_lsz=stage.clientWidth+'x'+stage.clientHeight+'x'+innerWidth;});};
if(window.ResizeObserver)new ResizeObserver(queueLayout).observe(stage);
document.fonts&&document.fonts.ready.then(redraw);
})();
</script>

</body></html>
